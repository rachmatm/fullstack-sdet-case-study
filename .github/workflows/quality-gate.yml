name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  pr-inputs:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate pull request inputs
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bash scripts/check-pr-body.sh

  api-rspec:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      RAILS_ENV: test
      SECRET_KEY_BASE: test-secret-key
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.2
          bundler-cache: false
      - name: Install backend dependencies
        run: bundle install
      - name: Run backend regression specs
        run: bundle exec rspec spec/requests/api/v1/authentication_spec.rb spec/models/session_spec.rb

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install frontend dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm install
      - name: Build frontend
        run: npm run build

  release-verdict:
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') }}
    needs:
      - api-rspec
      - web-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check release notes file
        id: release_notes_check
        continue-on-error: true
        run: |
          if [[ -f RELEASE_NOTES.md || -f CHANGELOG.md ]]; then
            echo "Release notes file found."
          else
            echo "Release notes file missing. Add RELEASE_NOTES.md or CHANGELOG.md." >&2
            exit 1
          fi
      - name: Publish release verdict
        if: ${{ always() }}
        env:
          TAG_NAME: ${{ github.ref_name }}
          API_RSPEC_RESULT: ${{ needs.api-rspec.result }}
          WEB_BUILD_RESULT: ${{ needs.web-build.result }}
          RELEASE_NOTES_RESULT: ${{ steps.release_notes_check.outcome }}
        run: bash scripts/release-verdict.sh
      - name: Upload release verdict artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: release-verdict-${{ github.ref_name }}
          path: release-verdict.md
